{% extends "base.html" %}
{% block title %}Edit Product — ARTSTORE ADMIN{% endblock %}

{% block content %}
<div class="page-header">
  <h1>Edit Product</h1>
  <a href="{{ url_for('admin_dashboard') }}" class="btn btn--ghost btn--small">← Back to Dashboard</a>
</div>

<section class="admin-section">
  <h2>Edit: {{ product.name }}</h2>
  <form method="POST" action="{{ url_for('admin_edit', product_id=product.id) }}" class="admin-form">
    <div class="form-row">
      <div class="form-group">
        <label>Name</label>
        <input type="text" name="name" value="{{ product.name }}" required />
      </div>
      <div class="form-group">
        <label>Price ($)</label>
        <input type="number" name="price" step="0.01" value="{{ product.price }}" required />
      </div>
      <div class="form-group">
        <label>Stock</label>
        <input type="number" name="stock" value="{{ product.stock }}" />
      </div>
    </div>
    <div class="form-group">
      <label>Description</label>
      <input type="text" name="description" value="{{ product.description or '' }}" />
    </div>
    <div class="form-group">
      <label>Image URL</label>
      <input type="text" name="image_url" value="{{ product.image_url or '' }}" />
    </div>
    <button type="submit" class="btn btn--accent">Update Product</button>
  </form>
</section>
{% endblock %}
