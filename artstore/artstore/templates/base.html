<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}ARTSTORE{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <nav>
    <a href="{{ url_for('index') }}" class="nav-logo">ARTSTORE</a>
    <div class="nav-links">
      <a href="{{ url_for('products') }}">Products</a>
      <a href="{{ url_for('cart') }}" class="cart-link">
        Cart {% if cart_count > 0 %}<span class="badge">{{ cart_count }}</span>{% endif %}
      </a>
    </div>
  </nav>

  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash--{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>ARTSTORE © 2026 &nbsp;·&nbsp; <a href="{{ url_for('admin') }}">Admin</a></p>
  </footer>
</body>
</html>
