{% extends "base.html" %}
{% block title %}Admin — ARTSTORE{% endblock %}

{% block content %}
<div class="admin-login">
  <h1>Admin Access</h1>
  <form method="POST" action="{{ url_for('admin') }}">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" placeholder="••••••••" autofocus />
    <button type="submit" class="btn btn--accent btn--full">Enter</button>
  </form>
</div>
{% endblock %}
